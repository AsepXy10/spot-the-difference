<!doctype html>
<html><head><meta charset="utf-8"><title>shotter</title>
<style>html,body{margin:0;padding:0;background:#000}iframe{width:1280px;height:720px;border:0;display:block}#st{position:fixed;left:8px;top:730px;color:#0f0;font:14px monospace}</style>
</head><body>
<div id="st">starting</div>
<script>
const q = new URLSearchParams(location.search);
const shot = q.get('shot') || 'play';
const seed = q.get('seed') || '1';
const name = q.get('name') || (shot + '.jpg');
const st = document.getElementById('st');
const f = document.createElement('iframe');
f.src = 'neon-dusk-single.html?shot=' + encodeURIComponent(shot) + '&seed=' + encodeURIComponent(seed);
document.body.appendChild(f);
st.textContent = 'loading ' + shot;
let tries = 0;
const iv = setInterval(() => {
  tries++;
  let w;
  try { w = f.contentWindow; } catch (e) { w = null; }
  if (w && w.__shotReady) {
    clearInterval(iv);
    st.textContent = 'ready, exporting ' + name;
    try {
      const src = f.contentDocument.querySelector('canvas');
      const c = document.createElement('canvas');
      c.width = 1280; c.height = 720;
      c.getContext('2d').drawImage(src, 0, 0, 1280, 720);
      c.toBlob((b) => {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = name;
        document.body.appendChild(a);
        a.click();
        st.textContent = 'downloaded ' + name + ' (' + b.size + ' bytes)';
      }, 'image/jpeg', 0.8);
    } catch (e) {
      st.textContent = 'export error: ' + e.message;
    }
  } else if (tries > 120) {
    clearInterval(iv);
    st.textContent = 'timeout waiting for __shotReady';
  }
}, 250);
</script>
</body></html>
